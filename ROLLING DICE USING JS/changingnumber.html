<!DOCTYPE html>
<html>
<head>
    <title>Random Number App</title>
    <style>
        body{
            text-align:center;
            font-family:Arial;
            margin-top:100px;
        }

        h1{
            font-size:50px;
        }

        button{
            padding:10px 20px;
            font-size:18px;
        }
    </style>
</head>
<body>

    <h1 id="number">0</h1>

    <button onclick="toggle()">Start / Stop</button>

    <script>
        var clicks = 0;
        var timer;

        function toggle() {
            clicks++;

            if (clicks % 2 != 0) {
               
                timer = setInterval(function () {
                    var num = Math.floor(Math.random() * 100) + 1;
                    document.getElementById("number").innerHTML = num;
                }, 500);
            } else {
                
                clearInterval(timer);
            }
        }
    </script>

</body>
</html>
